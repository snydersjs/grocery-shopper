<style>
  /* ─── Reset & Variables (matched to Grocery Shopper) ─── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:           #f0f7f0;
    --bg2:          #e6f2e6;
    --surface:      #ffffff;
    --surface2:     #f4faf4;
    --border:       #c8dfc8;
    --border-light: #ddeedd;
    --text:         #1a2e1a;
    --text-mid:     #4a6b4a;
    --text-dim:     #7a9b7a;
    --accent:       #2e7d32;
    --accent-dark:  #1b5e20;
    --accent-darker:#144a18;
    --accent-light: #e8f5e9;
    --accent-border:#81c784;
    --danger:       #c62828;
    --warn-bg:      #fff8e1;
    --warn-border:  #f9a825;
    --shadow:       0 1px 4px rgba(46,125,50,0.08);
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Lato', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    max-width: 100vw;
    overflow-x: hidden;
    position: relative;
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: 'Lato', sans-serif; }

  /* ─── Sync status pill ─── */
  #sync-status {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px;
    background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.9); white-space: nowrap;
  }
  #sync-status.saving  { background: rgba(255,255,255,0.25); color: #fff; }
  #sync-status.saved   { background: rgba(100,200,100,0.35); color: #fff; }
  #sync-status.error   { background: rgba(198,40,40,0.7);   color: #fff; }

  /* ─── Header ─── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--accent-dark); color: #fff;
    padding: 10px 16px 8px;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .header-title { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; white-space: nowrap; }
  .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .header-icon-btn {
    background: rgba(255,255,255,0.15); border: none; border-radius: 6px;
    color: rgba(255,255,255,0.9); font-size: 11px; font-weight: 700;
    padding: 4px 8px; cursor: pointer; white-space: nowrap; text-decoration: none;
  }
  .header-icon-btn:hover { background: rgba(255,255,255,0.25); }

  /* ─── Tabs ─── */
  .tab-bar {
    display: flex; background: var(--accent-dark); padding: 0 16px 10px; gap: 6px;
    position: sticky; top: 0; z-index: 99;
    box-shadow: 0 2px 8px rgba(27,94,32,0.3);
  }
  .tab-btn {
    flex: 1; padding: 7px 4px; border: none; border-radius: 8px;
    background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.8);
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .tab-btn.active { background: #fff; color: var(--accent-dark); }

  /* ─── Panels ─── */
  .tab-panel { display: none; padding: 12px 16px 80px; overflow-x: hidden; }
  .tab-panel.active { display: block; }
  .page { width: 100%; }   /* full width, same as the grocery app */

  /* ─── Toolbar / search ─── */
  .menu-toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .search-wrap { position: relative; flex: 1; min-width: 0; }
  .search-wrap input {
    width: 100%; padding: 9px 28px 9px 34px; border: 1px solid var(--border); border-radius: 8px;
    font-family: 'Lato', sans-serif; font-size: 14px; background: var(--surface); color: var(--text); outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent-border); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; pointer-events: none; }
  .search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; display: none; line-height: 1;
  }
  .search-clear.visible { display: block; }
  .toolbar-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; font-size: 12px; color: var(--text-mid); cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .toolbar-btn:hover { background: var(--surface2); }
  .toolbar-btn.primary { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; font-weight: 700; }
  .toolbar-btn.active  { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; font-weight: 700; }

  /* ─── Category cards ─── */
  .menu-cat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden;
  }
  .menu-cat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; cursor: pointer; user-select: none; -webkit-user-select: none;
    background: var(--accent-dark);
  }
  .menu-cat-header:hover { background: var(--accent-darker); }
  .menu-cat-title { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: #fff; }
  .cat-meta { display: flex; align-items: center; gap: 8px; }
  .cat-count {
    font-size: 11px; color: var(--accent-dark); font-weight: 700;
    background: rgba(255,255,255,0.92); border-radius: 10px; padding: 1px 8px;
  }
  .menu-cat-chevron { color: rgba(255,255,255,0.75); font-size: 12px; transition: transform 0.2s; }
  .menu-cat-card.open .menu-cat-chevron { transform: rotate(180deg); }
  .menu-cat-body { display: none; padding: 4px 14px 10px; }
  .menu-cat-card.open .menu-cat-body { display: block; }

  /* ─── Meal rows ─── */
  .menu-item-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid var(--border-light);
  }
  .menu-item-row:last-child { border-bottom: none; }
  .menu-add-week-btn {
    width: 28px; height: 28px; border: 1px solid var(--accent-border); border-radius: 6px;
    background: var(--accent-light); color: var(--accent-dark); font-size: 18px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-weight: 700; transition: all 0.15s;
  }
  .menu-add-week-btn.on-list { background: var(--accent-dark); color: #fff; border-color: var(--accent-dark); }
  .meal-link {
    flex: 1; min-width: 0; text-align: left; background: none; border: none; padding: 4px 0;
    font-size: 14px; color: var(--text); cursor: pointer; display: flex; align-items: center; gap: 6px;
  }
  .meal-link .meal-name { flex: 1; min-width: 0; }
  .meal-link .chev { color: var(--text-dim); font-size: 18px; flex-shrink: 0; }
  .no-recipe-tag {
    font-size: 10px; color: var(--text-dim); border: 1px dashed var(--border);
    border-radius: 8px; padding: 1px 6px; white-space: nowrap; flex-shrink: 0;
  }

  /* ─── This Week ─── */
  .dinner-row {
    display: flex; align-items: flex-start; gap: 8px; padding: 9px 4px;
    border-bottom: 1px solid var(--border-light); flex-wrap: wrap;
  }
  .dinner-check-btn {
    width: 28px; height: 28px; border: 2px solid var(--border); border-radius: 50%;
    background: var(--surface); cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: transparent; font-size: 15px; transition: all 0.15s;
  }
  .dinner-check-btn.done { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
  .dinner-name-btn {
    background: none; border: none; padding: 4px 0; font-size: 14px; color: var(--text);
    text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--accent-border);
    text-underline-offset: 3px;
  }
  .dinner-name-btn.done { color: var(--text-dim); text-decoration: line-through; }
  .dinner-delete-btn {
    background: none; border: none; color: var(--text-dim); font-size: 20px;
    cursor: pointer; padding: 0 2px; line-height: 1; flex-shrink: 0; margin-top: 3px;
  }
  .dinner-delete-btn:hover { color: var(--danger); }
  .dinner-done-section { margin-top: 12px; }
  .dinner-done-header {
    font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-dim); padding: 6px 4px; border-bottom: 1px solid var(--border-light);
    margin-bottom: 4px; display: flex; align-items: center; gap: 6px;
  }
  .dinner-done-header .cat-count { background: var(--bg2); }
  .dinner-add-row { display: flex; gap: 8px; margin-top: 14px; }
  .dinner-add-input {
    flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-family: 'Lato', sans-serif; font-size: 14px; background: var(--surface); color: var(--text); outline: none;
  }

    meals:     {},   // mealId → { name, category, hasRecipe, updatedAt }
    deletedAt: {},   // mealId → timestamp (tombstones, pruned after 30 days)
    seededAt:  0,    // set once by the seed; keeps the seed from ever running again
    namesAlignedAt: 0, // set once by the name/meal-list alignment with the grocery app
  };
}
function defaultPlanner() {
  return {
    thisWeek:    [],   // [{ id, mealId, name, done }]
    thisWeekAt:  0,
    dinnerNotes: {},   // entryId → note text (follows thisWeekAt, same as grocery app)
    takeout:     {},   // name → { category, url }
    takeoutAt:   0,
    takeoutImportedAt: 0,
    takeoutToppedUpAt: 0,
  };
}

function uuid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function shortId() { return Math.random().toString(36).slice(2, 6); }
function escAttr(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escHtml(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// For values placed inside onclick="fn('...')": escape quotes for JS, then for HTML
function jsArg(s) { return escAttr(String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
function slugify(s) {
  return String(s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'')
    .replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0, 60) || 'meal';
}
function normCat(c) { return MEAL_CATEGORIES.includes(c) ? c : 'Uncategorized'; }

function setSyncStatus(status, msg) {
  const el = document.getElementById('sync-status');
  el.className = status || '';

// ─── Quantity parsing & formatting ──────────────────────────────────────────
const UNI_FRAC = {'½':1/2,'¼':1/4,'¾':3/4,'⅓':1/3,'⅔':2/3,'⅛':1/8,'⅜':3/8,'⅝':5/8,'⅞':7/8,'⅙':1/6,'⅚':5/6,'⅕':1/5};
const FRACS = [[0,''],[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞'],[1,'']];

// "1 1/2", "1½", "1.5", "½", "1-2" (uses the first number) → number, or null if blank
function parseQty(str) {
  if (str == null) return null;
  let s = String(str).trim();
  if (!s) return null;
  s = s.replace(/[–—]/g, '-').split(/\s*(?:-|\bto\b)\s*/)[0];
  const re = /(\d+\/\d+)|(\d*\.\d+|\d+)|([½¼¾⅓⅔⅛⅜⅝⅞⅙⅚⅕])/g;
  let m, total = 0, found = false;
  while ((m = re.exec(s))) {
    found = true;
    if (m[1]) { const [a, b] = m[1].split('/').map(Number); if (b) total += a / b; }
    else if (m[2]) total += parseFloat(m[2]);
    else total += UNI_FRAC[m[3]];
  }
  return found ? Math.round(total * 10000) / 10000 : null;
}

function nearestFrac(f) {
  let best = FRACS[0], bd = 9;
  FRACS.forEach(x => { const d = Math.abs(f - x[0]); if (d < bd) { bd = d; best = x; } });
  return { best, diff: bd };
}
// Kitchen-friendly display: 1.5 → "1½", 0.3333 → "⅓"
function fmtFrac(n) {
  if (n >= 20) return String(Math.round(n));
  let w = Math.floor(n);
  let { best } = nearestFrac(n - w);
  if (best[0] === 1) { w += 1; best = FRACS[0]; }
  if (w === 0 && best[0] === 0) return n > 0 ? '⅛' : '0';
  return (w ? String(w) : '') + best[1];
}
function trimNum(n) { return String(Math.round(n * 1000) / 1000); }
// Value shown in the editor's qty box: a fraction if it is one, otherwise the exact decimal
function fmtQtyInput(q, unit) {
  if (q == null) return '';
  if (unit === 'lb') return trimNum(q);
  const w = Math.floor(q);
  const { diff } = nearestFrac(q - w);
  return diff < 0.01 ? fmtFrac(q) : trimNum(q);
}
// Pounds round to the nearest ¼ lb (never below ¼ lb)
function fmtLb(n) { return trimNum(Math.max(0.25, Math.round(n * 4) / 4)); }

// ─── Scaling quantities inside instruction text ─────────────────────────────
// Scales numbers like "1½ lb", "¾ cup", "2–3 tbsp", "4 garlic cloves".
// Leaves alone: times (minutes, hours), temperatures (°F), sizes ("1-inch", "6-oz"),
// can sizes in parentheses "(15 oz)", "2 per sandwich", and pressure-cooker minimums ("at least 1 cup").
const STEP_NUM = '(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:\\.\\d+)?[½¼¾⅓⅔⅛⅜⅝⅞⅙⅚]?|[½¼¾⅓⅔⅛⅜⅝⅞⅙⅚])';
const STEP_QTY_RE = new RegExp('(?<![\\w.\\/°])(' + STEP_NUM + ')(\\s*(?:–|—|-|to)\\s*)?(' + STEP_NUM + ')?(?![\\w\\/])', 'g');
const STEP_SKIP_AFTER = /^\s*(?:-\s*[a-z]|°|º|degrees?\b|min\b|mins\b|minutes?\b|sec\b|secs\b|seconds?\b|hours?\b|hrs?\b|days?\b|weeks?\b|inch(?:es)?\b|in\.|"|%|percent\b|times?\b|batch(?:es)?\b|steps?\b|x\b|(?:additional|more|extra)\s+(?:min|minutes?|seconds?|hours?)\b|(?:\w+\s+)?per\s+(?:serving|sandwich|person|portion|pita|taco|bowl)\b)/i;
const STEP_UNIT_AFTER = /^\s*(lbs?|pounds?|oz|ounces?|cups?|cans?|cloves?|tbsp|tsp)\b/i;

// Dry rice: our rice cooker does 0.5, 1 or 1.5 cups, so rice rounds to the nearest ½ cup (min ½)
const RICE_RE = /\brice\b/i;
const NOT_RICE_RE = /vinegar|noodle|wine|\bcooked\b|paper|cake|milk|water|broth|flour/i;
function isDryRice(name) {
  const head = String(name || '').split(/,| plus /i)[0];   // "dry rice plus water…" → "dry rice"
  return RICE_RE.test(head) && !NOT_RICE_RE.test(head);
}
function roundRiceCups(v) { return Math.max(0.5, Math.round(v * 2) / 2); }

function fmtStepQty(v, unit) {
  if (unit === 'lb') return fmtLb(v);
  if (unit === 'rice') return fmtFrac(roundRiceCups(v));
  if (unit === 'oz') return v >= 4 ? String(Math.round(v)) : fmtFrac(v);
  return fmtFrac(v);
}

function scaleStepHtml(text, factor) {
  const raw = String(text || '');
  if (Math.abs(factor - 1) < 1e-9) return escHtml(raw);
  const OPEN = '\u0001', CLOSE = '\u0002';
  const out = raw.replace(STEP_QTY_RE, (m, a, sep, b, offset) => {
    if (sep && !b) return m;                       // "2-" followed by a word: not a range
    const before = raw.slice(0, offset);
    const after  = raw.slice(offset + m.length);
    if (/at least\s*$/i.test(before)) return m;     // appliance minimum liquid
    if (/(?:step|#)\s*$/i.test(before)) return m;
    if (STEP_SKIP_AFTER.test(after)) return m;
    const um = after.match(STEP_UNIT_AFTER);
    let unit = um ? (/^(lbs?|pounds?)$/i.test(um[1]) ? 'lb' : /^(oz|ounces?)$/i.test(um[1]) ? 'oz' : 'other') : '';
    if (um && /^cups?$/i.test(um[1])) {
      // "1½ cups basmati rice", "1 cup dry long-grain rice": round like the rice cooker
      const next = after.slice(um[0].length, um[0].length + 40);
      if (/^\s*(?:[\w-]+\s+){0,3}rice\b/i.test(next) && !NOT_RICE_RE.test(next.split(/[,.;]/)[0])) unit = 'rice';
    }
    // Inside parentheses, leave can/package sizes like "(15 oz)" alone
    if (unit === 'oz' && (before.match(/\(/g) || []).length > (before.match(/\)/g) || []).length) return m;
    const va = parseQty(a);
    if (va == null) return m;
    let s = fmtStepQty(va * factor, unit);
    if (b) {
      const vb = parseQty(b);
      if (vb != null) s += sep.trim() === 'to' ? ' to ' : '–' + fmtStepQty(vb * factor, unit);
    }
    return OPEN + s + CLOSE;
  });
  // Fix singular/plural for cup/can/clove after a scaled number
  const fixed = out.replace(/\u0001([^\u0002]+)\u0002(\s*)(cups?|cans?|cloves?)\b/gi, (m, q, sp, word) => {
    const last = q.split(/–| to /).pop();
    const n = parseQty(last);
    const base = word.toLowerCase().replace(/s$/, '');
    return '\u0001' + q + '\u0002' + sp + (n != null && n > 1 ? base + 's' : base);
  });
  return escHtml(fixed).replace(/\u0001/g, '<b class="scaled">').replace(/\u0002/g, '</b>');
}
function unitLabel(unit, q) {
  if (!unit) return '';
  const plural = { cup:'cups', can:'cans', clove:'cloves', pinch:'pinches' };
  return q > 1 && plural[unit] ? plural[unit] : unit;
}

// Paste parser: "1 1/2 lb ground beef" → { qty:1.5, unit:'lb', name:'ground beef' }
const UNIT_ALIASES = {
  lb:'lb', lbs:'lb', pound:'lb', pounds:'lb',
  oz:'oz', ounce:'oz', ounces:'oz',
  cup:'cup', cups:'cup', c:'cup',
  tbsp:'tbsp', tbsps:'tbsp', tbs:'tbsp', tablespoon:'tbsp', tablespoons:'tbsp',
  tsp:'tsp', tsps:'tsp', teaspoon:'tsp', teaspoons:'tsp',
  can:'can', cans:'can', clove:'clove', cloves:'clove', pinch:'pinch', pinches:'pinch',
};
const NUM = '(?:\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:\\.\\d+)?\\s*[½¼¾⅓⅔⅛⅜⅝⅞]?|\\.\\d+|[½¼¾⅓⅔⅛⅜⅝⅞])';
const LEAD_QTY_RE = new RegExp('^(' + NUM + ')(?:\\s*(?:-|–|to)\\s*' + NUM + ')?\\s*');
function parseIngredientLine(line) {
  let s = line.trim().replace(/^[-•*•]\s*/, '');
  if (!s) return null;
  let qty = null;
  const m = s.match(LEAD_QTY_RE);
  if (m) { qty = parseQty(m[1]); s = s.slice(m[0].length); }
  let unit = '';
  const um = s.match(/^([a-zA-Z]+)\.?(?:\s+|$)/);
  if (um && UNIT_ALIASES[um[1].toLowerCase()] && qty != null) {
    unit = UNIT_ALIASES[um[1].toLowerCase()];
    s = s.slice(um[0].length);
  }
  s = s.replace(/^of\s+/i, '').trim();
  return { qty, unit, name: s || line.trim() };
}
function parseSteps(text) {
  return String(text || '').split(/\n+/)
    .map(l => l.trim().replace(/^(?:step\s*)?\d+\s*[.):-]\s*/i, '').trim())
    .filter(Boolean);
}

/**
 * Planner merge: SAME PATTERN AS THE GROCERY APP.
 * Local wins only if it was mutated this session AND is strictly newer than cloud.
 * A fresh session (timestamp 0) always defers to cloud.
 */
function mergePlanner(local, cloud) {
  const merged = defaultPlanner();

  // thisWeek (+ dinnerNotes, which follow thisWeekAt)
  const localWeekAt = local.thisWeekAt || 0;
  const cloudWeekAt = cloud.thisWeekAt || 0;
  if (localWeekAt > 0 && localWeekAt > cloudWeekAt) {
    merged.thisWeek    = local.thisWeek || [];
    merged.dinnerNotes = local.dinnerNotes || {};
  } else {
    merged.thisWeek    = cloud.thisWeek || local.thisWeek || [];
    merged.dinnerNotes = cloud.dinnerNotes || {};
  }
  merged.thisWeekAt = Math.max(localWeekAt, cloudWeekAt);

  // takeout
  const localTakeoutAt = local.takeoutAt || 0;
  const cloudTakeoutAt = cloud.takeoutAt || 0;
  if (localTakeoutAt > 0 && localTakeoutAt > cloudTakeoutAt) {
    merged.takeout = local.takeout || {};
  } else {
    merged.takeout = cloud.takeout || local.takeout || {};
  }
  merged.takeoutAt = Math.max(localTakeoutAt, cloudTakeoutAt);
  merged.takeoutImportedAt = Math.max(local.takeoutImportedAt || 0, cloud.takeoutImportedAt || 0);
  merged.takeoutToppedUpAt = Math.max(local.takeoutToppedUpAt || 0, cloud.takeoutToppedUpAt || 0);
  return merged;
}

/**
 * Meal index merge: per-meal, so two people adding meals at once never lose one.
 * Newer updatedAt wins per meal; a newer tombstone (deletion) beats both.
 * (Same approach the grocery app uses for its `items`.)
 */
function mergeIndex(local, cloud) {
  const merged = defaultIndex();
  merged.seededAt = Math.max(local.seededAt || 0, cloud.seededAt || 0);
  merged.namesAlignedAt = Math.max(local.namesAlignedAt || 0, cloud.namesAlignedAt || 0);

  const tombKeys = new Set([...Object.keys(local.deletedAt || {}), ...Object.keys(cloud.deletedAt || {})]);
  tombKeys.forEach(k => {
    merged.deletedAt[k] = Math.max((local.deletedAt || {})[k] || 0, (cloud.deletedAt || {})[k] || 0);
  });

  const mealKeys = new Set([...Object.keys(local.meals || {}), ...Object.keys(cloud.meals || {})]);
  mealKeys.forEach(k => {
    const lm = (local.meals || {})[k];
    const cm = (cloud.meals || {})[k];
    const winner = (lm && cm) ? ((lm.updatedAt || 0) >= (cm.updatedAt || 0) ? lm : cm) : (lm || cm);
    if ((merged.deletedAt[k] || 0) > (winner.updatedAt || 0)) return;   // deletion wins
    merged.meals[k] = { ...winner };
  });
  return merged;
}

function pruneTombstones() {
  const cutoff = Date.now() - TOMBSTONE_MAX_AGE;
  Object.keys(index.deletedAt).forEach(k => { if (index.deletedAt[k] < cutoff) delete index.deletedAt[k]; });
}

/** First load ever: write the recipe seed. Runs inside a transaction so two devices can't both seed. */
async function runSeedIfNeeded() {
  const now = Date.now();
  await runTransaction(db, async tx => {
    const snap = await tx.get(INDEX_REF);
    if (snap.exists() && snap.data().seededAt) return;            // already seeded: inert
    const existing = snap.exists() ? snap.data() : defaultIndex();
    const meals = { ...(existing.meals || {}) };
    const used  = new Set(Object.keys(meals));
    (typeof RECIPE_SEED !== 'undefined' ? RECIPE_SEED : []).forEach(r => {
      let id = slugify(r.name);
      while (used.has(id)) id = slugify(r.name) + '-' + shortId();
      used.add(id);
      const category = normCat(r.category);
      const recipe = {
        name: r.name,
        category,
        baseServings: BASE_SERVINGS,
        ingredients: (r.ingredients || []).map(i => ({
          qty:  typeof i.qty === 'number' ? i.qty : null,
          unit: UNITS.includes(i.unit) ? i.unit : '',
          name: String(i.name || '').trim(),
        })),
        instructions: (r.instructions || []).map(s => String(s)),
        notes: r.notes || '',
        updatedAt: now,
      };
      tx.set(recipeRef(id), recipe);
      meals[id] = { name: r.name, category, hasRecipe: true, updatedAt: now };
    });
    tx.set(INDEX_REF, { meals, deletedAt: existing.deletedAt || {}, seededAt: now });
  });
}

/** First load ever: copy the grocery app's current takeout list (read only). */
/**
 * One-time top-up: adds restaurants (and links) from the grocery app that the
 * recipe app doesn't have yet. Never removes or changes anything already here,
 * except filling in a link that is blank. Reads the grocery app only.
 */
async function topUpTakeoutIfNeeded() {
  const now = Date.now();
  await runTransaction(db, async tx => {
    const pSnap = await tx.get(PLANNER_REF);
    if (!pSnap.exists() || pSnap.data().takeoutToppedUpAt) return;
    const gSnap = await tx.get(GROCERY_REF);
    const data = pSnap.data();
    const mine = JSON.parse(JSON.stringify(data.takeout || {}));
    const theirs = (gSnap.exists() && gSnap.data().takeout) || {};
    const byName = {};
    Object.keys(mine).forEach(n => { byName[normName(n)] = n; });
    Object.entries(theirs).forEach(([n, r]) => {
      const existing = byName[normName(n)];
      if (!existing) {
        mine[n] = { category: (r && r.category) || 'Uncategorized', url: (r && r.url) || '' };
      } else if (!mine[existing].url && r && r.url) {
        mine[existing].url = r.url;
      }
    });
    tx.set(PLANNER_REF, { ...data, takeout: mine, takeoutAt: now, takeoutToppedUpAt: now });
  });
}

async function importTakeoutIfNeeded() {
  const now = Date.now();
  await runTransaction(db, async tx => {
    const pSnap = await tx.get(PLANNER_REF);
    if (pSnap.exists() && pSnap.data().takeoutImportedAt) return;
    const gSnap = await tx.get(GROCERY_REF);
    const groceryTakeout = gSnap.exists() ? gSnap.data().takeout : null;
    let takeout = {};
    if (groceryTakeout && Object.keys(groceryTakeout).length > 0) {
      takeout = JSON.parse(JSON.stringify(groceryTakeout));
    } else {
      TAKEOUT_SEED.forEach(r => { takeout[r.name] = { category: r.category, url: r.url }; });
    }
    const base = pSnap.exists() ? pSnap.data() : {};
    tx.set(PLANNER_REF, { ...defaultPlanner(), ...base, takeout, takeoutAt: now, takeoutImportedAt: now });
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// ONE-TIME ALIGNMENT WITH THE GROCERY APP'S MENU
// 1. Renames recipes back to the meal names used in the grocery app
// 2. Uses the grocery app's category for every meal whose name matches
// 3. Adds grocery meals that have no recipe yet (shown with a "no recipe" tag)
// Reads the grocery app (never writes to it). Runs once, then is inert.
// ─────────────────────────────────────────────────────────────────────────────
const RENAME_MAP = {
  'Renaissance of Tuna Casserole (Tuna Fettuccine)': 'Tuna and Sundried Tomato Pasta',
  'Beef Pizzaiola (Ninja Foodi Pressure Cooker)': 'Beef Pizzaiola',

  'Minestrone Soup with Pasta, Beans and Vegetables (Ninja Foodi)': 'Minestrone',
  'Prosciutto & Green Pea Risotto': 'Risotto with Prosciutto and Peas',
  'Korean Ground Beef Rice Bowls with Bok Choy': 'Korean Beef Rice Bowls',
  'Patty Melts with Caramelized Onions': 'Patty Melts',
  'Pan-Seared Pork Chops': 'Pork chops',
  'Beef Barley Soup': 'Beef barley soup',
  'Corn Chowder with Coconut Milk': 'Corn Chowder',
  'BBQ Chicken Lavash Flatbread': 'BBQ Chicken Flatbread',
  'Chicken Schnitzel with Warm Potato & Pea Salad': 'Chicken Schnitzel with Warm Potato and Pea Salad',
  'Skillet Chicken Enchiladas with Roasted Hatch Green Chiles': 'Chicken Enchilada Skillet',
  'Ginger-Sesame Chicken with Bok Choy & Noodles': 'Ginger-Sesame Chicken with Bok Choy',
  'Turkey Kofta with Rice, Yogurt Sauce & Cucumber-Tomato Salad': 'Turkey Kofta',

  'Southwestern Falafel Patties with Avocado Spread': 'Southwest Falafel',
  'Swiss Chard, White Bean & Parmesan Skillet with Rice': 'Swiss Chard, White Bean & Parmesan Skillet w/ Rice',
  'Chicken Shawarma': 'Chicken Schwarma',
  'Crispy Tofu & Chicken with Tatsoi and Peanut Sauce': 'Crispy Tofu & Chicken with Tatsoi, Rice and Peanut Sauce',
  'Pork Pozole Verde with Roasted Hatch Green Chiles': 'Pork Pozole',
  'Crispy Halloumi Pitas': 'Fried Halloumi',
  'Crispy Gnocchi with Prosciutto, Peas & Parmesan Sauce': 'Gnocchi with Prosciutto',
  'Sausage and White Bean Soup with Escarole': 'Escarole, White Bean and Sausage Soup',
};
// Grocery menu names that refer to a recipe under a different name (so they aren't imported twice)
const GROCERY_ALIASES = {
  'Gnocchi with Pancetta': 'Gnocchi with Prosciutto',
};
const normName = s => String(s || '').trim().toLowerCase();

async function alignWithGroceryMenuIfNeeded() {
  const now = Date.now();
  await runTransaction(db, async tx => {
    // All reads first (Firestore transaction rule)
    const iSnap = await tx.get(INDEX_REF);
    if (!iSnap.exists() || iSnap.data().namesAlignedAt) return;   // already done: inert
    const gSnap = await tx.get(GROCERY_REF);
    const data  = iSnap.data();
    const meals = { ...(data.meals || {}) };

    // Grocery menu: { name: {category} } (older versions stored an array)
    let gMenu = gSnap.exists() ? (gSnap.data().dinnerMenu || {}) : {};
    if (Array.isArray(gMenu)) {
      const o = {}; gMenu.forEach(e => { if (e && e.name) o[e.name] = { category: e.category }; }); gMenu = o;
    }
    const gCats = {};
    Object.entries(gMenu).forEach(([n, v]) => {
      const target = GROCERY_ALIASES[n] || n;
      gCats[normName(target)] = normCat(v && v.category);
    });

    // Work out renames/category changes, and read the recipe docs we'll touch
    const changes = [];
    Object.entries(meals).forEach(([id, m]) => {
      const newName = RENAME_MAP[m.name] || m.name;
      const newCat  = gCats[normName(newName)] || normCat(m.category);
      if (newName !== m.name || newCat !== m.category) changes.push({ id, m, newName, newCat });
    });
    const recipeSnaps = {};
    for (const c of changes) {
      if (c.m.hasRecipe) recipeSnaps[c.id] = await tx.get(recipeRef(c.id));
    }

    // Writes
    changes.forEach(({ id, m, newName, newCat }) => {
      meals[id] = { ...m, name: newName, category: newCat, updatedAt: now };
      if (recipeSnaps[id] && recipeSnaps[id].exists()) {
        tx.set(recipeRef(id), { ...recipeSnaps[id].data(), name: newName, category: newCat, updatedAt: now });
      }
    });

    const have = new Set(Object.values(meals).map(m => normName(m.name)));
    const usedIds = new Set([...Object.keys(meals), ...Object.keys(data.deletedAt || {})]);
    Object.entries(gMenu).forEach(([n, v]) => {
      const target = GROCERY_ALIASES[n] || n;
      if (have.has(normName(target))) return;
      let id = slugify(target);
      while (usedIds.has(id)) id = slugify(target) + '-' + shortId();
      usedIds.add(id);
      have.add(normName(target));
      meals[id] = { name: target.trim(), category: normCat(v && v.category), hasRecipe: false, updatedAt: now };
    });

    tx.set(INDEX_REF, { ...data, meals, namesAlignedAt: now });
  });
}

async function loadFromCloud() {
  setSyncStatus('saving', '● Loading…');
  try {
    let [iSnap, pSnap] = await Promise.all([getDoc(INDEX_REF), getDoc(PLANNER_REF)]);

    if (!iSnap.exists() || !iSnap.data().seededAt) {
      setSyncStatus('saving', '● Setting up…');
      await runSeedIfNeeded();
      iSnap = await getDoc(INDEX_REF);
    }
    if (iSnap.exists() && !iSnap.data().namesAlignedAt) {
      setSyncStatus('saving', '● Updating…');
      await alignWithGroceryMenuIfNeeded();
      iSnap = await getDoc(INDEX_REF);
    }
    if (!pSnap.exists() || !pSnap.data().takeoutImportedAt) {
      await importTakeoutIfNeeded();
      pSnap = await getDoc(PLANNER_REF);
    }
    if (pSnap.exists() && !pSnap.data().takeoutToppedUpAt) {
      await topUpTakeoutIfNeeded();
      pSnap = await getDoc(PLANNER_REF);
    }

    index   = mergeIndex(index,   iSnap.exists() ? iSnap.data() : {});
    planner = mergePlanner(planner, pSnap.exists() ? pSnap.data() : {});
    loaded = true;
    loadError = null;
    setSyncStatus('', '● Ready');
  } catch (e) {
    console.error('Load error:', e);
    loadError = e;
    setSyncStatus('error', '● Error');
  }
  renderAll();
}

// Planner saves: read-merge-write, exactly like the grocery app
let plannerTimer = null;
function schedulePlannerSave() {
  clearTimeout(plannerTimer);
  plannerTimer = setTimeout(() => savePlanner(), 2500);
}
async function savePlanner() {
  clearTimeout(plannerTimer);
  setSyncStatus('saving', '● Saving…');
  try {
    const snap = await getDoc(PLANNER_REF);
    if (snap.exists()) planner = mergePlanner(planner, snap.data());
    await setDoc(PLANNER_REF, planner);
    setSyncStatus('saved', '● Saved');
    setTimeout(() => setSyncStatus('', '● Ready'), 1500);
  } catch (e) {
    console.error('Planner save error:', e);
    setSyncStatus('error', '● Error');
  }
}

// Index saves: read-merge-write with per-meal merge
async function saveIndex() {
  setSyncStatus('saving', '● Saving…');
  try {
    const snap = await getDoc(INDEX_REF);
    if (snap.exists()) index = mergeIndex(index, snap.data());
    pruneTombstones();
    await setDoc(INDEX_REF, index);
    setSyncStatus('saved', '● Saved');
    setTimeout(() => setSyncStatus('', '● Ready'), 1500);
  } catch (e) {
    console.error('Index save error:', e);
    setSyncStatus('error', '● Error');
    throw e;
  }
}

async function fetchRecipe(id) {
  const snap = await getDoc(recipeRef(id));
  if (snap.exists()) { recipeCache[id] = snap.data(); return recipeCache[id]; }
  return null;
}

// Reload when the app comes back to the foreground (same as grocery app)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    loadFromCloud();
    if (currentView.v === 'recipe') requestWakeLock();
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// NAVIGATION  (tabs + recipe/editor views; iPhone swipe-back works via history)
// ─────────────────────────────────────────────────────────────────────────────
function showPanel(id) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
}
function markTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
}

function switchTab(tab) {
  if (currentView.v !== 'tab') {
    if ((currentView.v === 'editor' || currentView.v === 'import') && editorDirty && !confirm('Discard your changes?')) return;
    editorDirty = false;
    pendingTab = tab;
    history.go(-(currentView.d || 1));   // unwind recipe/editor views; popstate finishes the switch
    return;
  }
  activeTab = tab;
  markTab(tab);
  showPanel('tab-' + tab);
  renderAll();
  window.scrollTo(0, 0);
}
window.switchTab = switchTab;

const scrollMemory = {};
function pushView(state) {
  if (currentView.v === 'tab') scrollMemory[activeTab] = window.scrollY;
  const next = { ...state, d: (currentView.d || 0) + 1 };
  history.pushState(next, '');
  applyView(next);
}

function applyView(state) {
  currentView = state || { v: 'tab', d: 0 };
  if (currentView.v === 'recipe') {
    markTab(activeTab);
    showPanel('tab-recipe');
    renderRecipeView(currentView.id);
    window.scrollTo(0, 0);
    requestWakeLock();
  } else if (currentView.v === 'import') {
    showPanel('tab-import');
    renderImport(currentView.id || null);
    window.scrollTo(0, 0);
    releaseWakeLock();
  } else if (currentView.v === 'editor') {
    showPanel('tab-editor');
    renderEditor(currentView.id || null, currentView.preset || null);
    window.scrollTo(0, 0);
    releaseWakeLock();
  } else {
    releaseWakeLock();
    if (pendingTab) { activeTab = pendingTab; pendingTab = null; }
    markTab(activeTab);
    showPanel('tab-' + activeTab);
    renderAll();
    window.scrollTo(0, scrollMemory[activeTab] || 0);
  }
}

window.addEventListener('popstate', e => {
  if ((currentView.v === 'editor' || currentView.v === 'import') && editorDirty) {
    if (!confirm('Discard your changes?')) {
      history.pushState(currentView, '');   // stay in the editor
      return;
    }
    editorDirty = false;
  }
  applyView(e.state || { v: 'tab', d: 0 });
});

function goBack() { history.back(); }
window.goBack = goBack;

function openRecipe(id) { pushView({ v: 'recipe', id }); }
window.openRecipe = openRecipe;
function openEditor(id) { pushView({ v: 'editor', id: id || null }); }
function openImport(id) { pushView({ v: 'import', id: id || null }); }
window.openImport = openImport;
window.openEditor = openEditor;

// Keep the screen awake while a recipe is open (supported on recent iPhones and Chrome/Edge)
let wakeLock = null;
async function requestWakeLock() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }
  catch (e) { wakeLock = null; }
}
function releaseWakeLock() { try { wakeLock?.release(); } catch (e) {} wakeLock = null; }

// ─────────────────────────────────────────────────────────────────────────────
// RENDER ORCHESTRATOR
// ─────────────────────────────────────────────────────────────────────────────
function renderAll() {
  renderHeader();
  if (currentView.v !== 'tab') return;   // never redraw over an open recipe or editor
  if (activeTab === 'meals')   renderMeals();
  if (activeTab === 'week')    renderWeek();
  if (activeTab === 'takeout') renderTakeout();
}

function renderHeader() {
  const headerEl = document.querySelector('header');
  const tabBarEl = document.getElementById('tab-bar');
  if (headerEl && tabBarEl) tabBarEl.style.top = headerEl.offsetHeight + 'px';
}

function errorBox() {
  if (!loadError) return '';
  const denied = loadError.code === 'permission-denied';
  return `<div class="error-box">${denied
    ? '<b>The database refused access.</b> The Firestore rules need to allow the <b>recipes</b> collection. See the setup steps.'
    : '<b>Couldn\'t reach the database.</b> Check your connection and reopen the app.'}</div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// MEALS TAB
// ─────────────────────────────────────────────────────────────────────────────
function buildMealGroups() {
  const groups = {};
  MEAL_CATEGORIES.forEach(c => { groups[c] = []; });
  Object.entries(index.meals || {}).forEach(([id, m]) => {
    groups[normCat(m.category)].push({ id, ...m });
  });
  MEAL_CATEGORIES.forEach(c => groups[c].sort((a, b) => a.name.localeCompare(b.name)));
  return groups;
}

function renderMeals() {
  const container = document.getElementById('meals-view');
  if (!loaded && !loadError) { container.innerHTML = '<div class="loading-msg">Loading meals…</div>'; return; }
  container.innerHTML = `${errorBox()}
    <div class="menu-toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="meal-search-input" placeholder="Search meals…" value="${escAttr(mealSearch)}"
          oninput="onMealSearch(this.value)" autocomplete="off">
        <button class="search-clear${mealSearch ? ' visible' : ''}" id="meal-search-clear" onclick="clearMealSearch()">×</button>
      </div>
      <button class="toolbar-btn" onclick="toggleAllMealCats()" id="meal-expand-btn">${openMealCats.size ? 'Collapse' : 'Expand'}</button>
      <button class="toolbar-btn primary" onclick="openImport()">Import</button>
    </div>
    <div id="meal-categories"></div>`;
  renderMealCategories();
}

function renderMealCategories() {
  const container = document.getElementById('meal-categories');
  if (!container) return;
  const onWeek = new Set((planner.thisWeek || []).map(d => d.mealId).filter(Boolean));
  const term   = mealSearch.toLowerCase().trim();
  const groups = buildMealGroups();
  let html = '';
  let total = 0;

  MEAL_CATEGORIES.forEach(cat => {
    let items = groups[cat];
    if (term) items = items.filter(m => m.name.toLowerCase().includes(term));
    if (items.length === 0) return;
    total += items.length;
    const isOpen = openMealCats.has(cat) || !!term;
    html += `<div class="menu-cat-card${isOpen ? ' open' : ''}" id="meal-cat-${slugify(cat)}">
      <div class="menu-cat-header" onclick="toggleMealCat('${jsArg(cat)}')">
        <span class="menu-cat-title">${escHtml(cat)}</span>
        <span class="cat-meta"><span class="cat-count">${items.length}</span><span class="menu-cat-chevron">▼</span></span>
      </div>
      <div class="menu-cat-body">`;
    items.forEach(m => {
      const on = onWeek.has(m.id);
      html += `<div class="menu-item-row">
        <button class="menu-add-week-btn${on ? ' on-list' : ''}" onclick="toggleMealThisWeek('${jsArg(m.id)}')"
          title="${on ? 'Remove from This Week' : 'Add to This Week'}">${on ? '✓' : '+'}</button>
        <button class="meal-link" onclick="openRecipe('${jsArg(m.id)}')">
          <span class="meal-name">${escHtml(m.name)}</span>
          ${m.hasRecipe ? '' : '<span class="no-recipe-tag">no recipe</span>'}
          <span class="chev">›</span>
        </button>
      </div>`;
    });
    html += '</div></div>';
  });

  if (total === 0) {
    html = term
      ? `<div class="empty-msg">No meals match "${escHtml(mealSearch)}".</div>`
      : (loaded ? '<div class="empty-msg">No meals yet. Tap + New to add one.</div>' : '');
  }
  container.innerHTML = html;
}

function toggleMealCat(cat) {
  if (openMealCats.has(cat)) openMealCats.delete(cat); else openMealCats.add(cat);
  saveOpenCats();
  document.getElementById('meal-cat-' + slugify(cat))?.classList.toggle('open', openMealCats.has(cat));
  const btn = document.getElementById('meal-expand-btn');
  if (btn) btn.textContent = openMealCats.size ? 'Collapse' : 'Expand';
}
window.toggleMealCat = toggleMealCat;

function toggleAllMealCats() {
  openMealCats = openMealCats.size ? new Set() : new Set(MEAL_CATEGORIES);
  saveOpenCats();
  renderMeals();
}
window.toggleAllMealCats = toggleAllMealCats;

function onMealSearch(val) {
  mealSearch = val;
  document.getElementById('meal-search-clear')?.classList.toggle('visible', !!val.trim());
  renderMealCategories();   // categories only, so the search box keeps focus
}
window.onMealSearch = onMealSearch;

function clearMealSearch() {
  mealSearch = '';
  const input = document.getElementById('meal-search-input');
  if (input) input.value = '';
  document.getElementById('meal-search-clear')?.classList.remove('visible');
  renderMealCategories();
}
window.clearMealSearch = clearMealSearch;

function isOnWeek(mealId) { return (planner.thisWeek || []).some(d => d.mealId === mealId); }

function toggleMealThisWeek(mealId) {
  const meal = index.meals[mealId];
  if (!meal) return;
  planner.thisWeek = planner.thisWeek || [];
  const idx = planner.thisWeek.findIndex(d => d.mealId === mealId);
  if (idx >= 0) {
    const removed = planner.thisWeek.splice(idx, 1)[0];
    delete planner.dinnerNotes[removed.id];
    toast('Removed from This Week');
  } else {
    planner.thisWeek.push({ id: uuid(), mealId, name: meal.name, done: false });
    toast('Added to This Week');
  }
  planner.thisWeekAt = Date.now();
  savePlanner();
  if (currentView.v === 'recipe') renderWeekPill(mealId);
  else renderAll();
}
window.toggleMealThisWeek = toggleMealThisWeek;

// ─────────────────────────────────────────────────────────────────────────────
// THIS WEEK TAB
// ─────────────────────────────────────────────────────────────────────────────
function weekEntryName(d) { return (d.mealId && index.meals[d.mealId]?.name) || d.name; }

function renderWeek() {
  const container = document.getElementById('week-view');
  if (!loaded && !loadError) { container.innerHTML = '<div class="loading-msg">Loading…</div>'; return; }
  const active = (planner.thisWeek || []).filter(d => !d.done);
  const done   = (planner.thisWeek || []).filter(d =>  d.done);
  let html = errorBox() + '<div>';

  if (active.length === 0 && done.length === 0) {
    html += '<div class="empty-msg">No dinners planned yet.<br>Tap + next to a meal, or type one below.</div>';
  }
  active.forEach(d => { html += renderWeekRow(d, false); });
  if (done.length > 0) {
    html += `<div class="dinner-done-section">
      <div class="dinner-done-header"><span>Made</span><span class="cat-count">${done.length}</span></div>`;
    done.forEach(d => { html += renderWeekRow(d, true); });
    html += '</div>';
  }
  html += `</div>
  <div class="dinner-add-row">
    <input class="dinner-add-input" id="week-add-input" placeholder="Add a dinner…"
      onkeydown="if(event.key==='Enter')addWeekDinner()" autocomplete="off">
    <button class="dinner-add-btn" onclick="addWeekDinner()">Add</button>
  </div>
  ${(planner.thisWeek || []).length ? `<div class="dinner-footer">
    <button class="btn-secondary" onclick="openModal('modal-clear-week')">Clear All</button>
  </div>` : ''}`;
  container.innerHTML = html;
}

function renderWeekRow(d, isDone) {
  const note = (planner.dinnerNotes || {})[d.id] || '';
  const id = jsArg(d.id);
  return `<div class="dinner-row">
    <button class="dinner-check-btn${isDone ? ' done' : ''}" onclick="toggleWeekDone('${id}')">✓</button>
    <div style="flex:1;min-width:0;">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <button class="dinner-name-btn${isDone ? ' done' : ''}" onclick="openWeekEntry('${id}')">${escHtml(weekEntryName(d))}</button>
        ${note
          ? `<button class="shop-note-tag" onclick="toggleWeekNote('${id}')">${escHtml(note)}</button>`
          : `<button class="shop-add-note-btn" onclick="toggleWeekNote('${id}')">+ note</button>`}
      </div>
      <input class="shop-note-input" id="week-note-${escAttr(d.id)}" value="${escAttr(note)}" placeholder="Add note…"
        onkeydown="if(event.key==='Enter')this.blur()"
        onblur="saveWeekNote('${id}', this.value)">
    </div>
    <button class="dinner-delete-btn" onclick="deleteWeekEntry('${id}')">×</button>
  </div>`;
}

function openWeekEntry(entryId) {
  const d = (planner.thisWeek || []).find(x => x.id === entryId);
  if (!d) return;
  if (d.mealId && index.meals[d.mealId]) { openRecipe(d.mealId); return; }
  // Entry with no linked meal (or its meal was deleted): link by name, or create the meal
  const mealId = findOrCreateMeal(d.name);
  d.mealId = mealId;
  planner.thisWeekAt = Date.now();
  savePlanner();
  openRecipe(mealId);
}
window.openWeekEntry = openWeekEntry;

function toggleWeekNote(id) {
  const el = document.getElementById('week-note-' + id);
  if (!el) return;
  if (el.classList.toggle('open')) { el.focus(); el.select(); }
}
window.toggleWeekNote = toggleWeekNote;

function saveWeekNote(id, text) {
  const trimmed = text.trim();
  const prev = planner.dinnerNotes[id] || '';
  if (trimmed === prev) { renderWeek(); return; }
  if (trimmed) planner.dinnerNotes[id] = trimmed; else delete planner.dinnerNotes[id];
  planner.thisWeekAt = Date.now();
  schedulePlannerSave();
  renderWeek();
}
window.saveWeekNote = saveWeekNote;

function findOrCreateMeal(name) {
  const norm = name.trim().toLowerCase();
  const existing = Object.entries(index.meals).find(([, m]) => m.name.trim().toLowerCase() === norm);
  if (existing) return existing[0];
  let id = slugify(name);
  while (index.meals[id] || index.deletedAt[id]) id = slugify(name) + '-' + shortId();
  index.meals[id] = { name: name.trim(), category: 'Uncategorized', hasRecipe: false, updatedAt: Date.now() };
  saveIndex().catch(() => {});
  return id;
}

function addWeekDinner() {
  const input = document.getElementById('week-add-input');
  const name  = input?.value.trim();
  if (!name) return;
  const mealId = findOrCreateMeal(name);
  planner.thisWeek.push({ id: uuid(), mealId, name: index.meals[mealId].name, done: false });
  planner.thisWeekAt = Date.now();
  input.value = '';
  savePlanner();
  renderWeek();
}
window.addWeekDinner = addWeekDinner;

function toggleWeekDone(id) {
  const d = (planner.thisWeek || []).find(x => x.id === id);
  if (!d) return;
  d.done = !d.done;
  planner.thisWeekAt = Date.now();
  savePlanner();
  renderWeek();
}
window.toggleWeekDone = toggleWeekDone;

function deleteWeekEntry(id) {
  planner.thisWeek = (planner.thisWeek || []).filter(d => d.id !== id);
  delete planner.dinnerNotes[id];
  planner.thisWeekAt = Date.now();
  savePlanner();
  renderWeek();
}
window.deleteWeekEntry = deleteWeekEntry;

function clearWeek() {
  planner.thisWeek    = [];
  planner.dinnerNotes = {};
  planner.thisWeekAt  = Date.now();
  closeModal('modal-clear-week');
  savePlanner();
  renderWeek();
}
window.clearWeek = clearWeek;

// ─────────────────────────────────────────────────────────────────────────────
// RECIPE DETAIL VIEW  (recipe content is fetched only here, on demand)
// ─────────────────────────────────────────────────────────────────────────────
function renderRecipeView(id) {
  const container = document.getElementById('recipe-view');
  const meal = index.meals[id];
  const top = `<div class="rv-top">
      <button class="back-btn" onclick="goBack()">‹ Back</button>
      <div class="spacer"></div>
      ${meal ? `<button class="toolbar-btn" onclick="openEditor('${jsArg(id)}')">Edit</button>` : ''}
    </div>`;

  if (!meal) {
    container.innerHTML = top + '<div class="empty-msg">This meal no longer exists.</div>';
    return;
  }

  const head = `${top}
    <div class="rv-title">${escHtml(meal.name)}&nbsp;<span id="week-pill-wrap">${weekPillHtml(id)}</span></div>`;

  if (!meal.hasRecipe) {
    container.innerHTML = head + `<div class="rv-card"><div class="rv-card-body">
      <div class="empty-msg">No recipe yet.</div>
      <div style="text-align:center;padding-bottom:10px;"><button class="btn-primary" onclick="openImport('${jsArg(id)}')">Add recipe</button></div>
    </div></div>`;
    return;
  }

  const cached = recipeCache[id];
  if (cached) {
    container.innerHTML = head + recipeBodyHtml(cached);
    refreshCartIcons();
  } else {
    container.innerHTML = head + '<div class="loading-msg">Loading recipe…</div>';
  }
  // Always fetch fresh in the background; redraw only if something changed
  fetchRecipe(id).then(r => {
    if (currentView.v !== 'recipe' || currentView.id !== id) return;
    if (!r) {
      container.innerHTML = head + `<div class="rv-card"><div class="rv-card-body">
        <div class="empty-msg">Recipe not found.</div>
        <div style="text-align:center;padding-bottom:10px;"><button class="btn-primary" onclick="openImport('${jsArg(id)}')">Add recipe</button></div>
      </div></div>`;
      return;
    }
    if (!cached || cached.updatedAt !== r.updatedAt) { container.innerHTML = head + recipeBodyHtml(r); refreshCartIcons(); }
  }).catch(e => {
    console.error('Recipe load error:', e);
    if (!cached && currentView.v === 'recipe' && currentView.id === id) {
      container.innerHTML = head + '<div class="error-box">Couldn\'t load this recipe. Check your connection and try again.</div>';
    }
  });
}

function weekPillHtml(id) {
  const on = isOnWeek(id);
  return `<button class="week-circle${on ? ' on' : ''}" onclick="toggleMealThisWeek('${jsArg(id)}')" title="${on ? 'On This Week (tap to remove)' : 'Add to This Week'}">${on ? '✓' : '+'}</button>`;
}
function renderWeekPill(id) {
  const wrap = document.getElementById('week-pill-wrap');
  if (wrap) wrap.innerHTML = weekPillHtml(id);
}

function cartBtnHtml(k) {
  if (k == null) return '';
  return `<button class="cart-btn" id="cart-${k}" title="Add to grocery list" onclick="event.stopPropagation();openGroceryAdd(${k})">🛒</button>`;
}

function ingredientHtml(ing, factor, k) {
  const name = escHtml(ing.name);
  const cls = k == null ? 'ing' : 'ing has-cart';
  if (ing.qty == null || ing.qty === '') {
    return `<li class="${cls}" onclick="this.classList.toggle('got')"><span class="ing-text"><span class="ing-name">${name}</span></span>${cartBtnHtml(k)}</li>`;
  }
  // Pressure-cooker minimum liquid: never scale below the amount written
  const q = (/minimum/i.test(ing.name) && factor < 1) ? ing.qty : ing.qty * factor;
  let qtyText;
  if (ing.unit === 'lb') {
    qtyText = `${fmtLb(q)} lb`;
  } else if (ing.unit === 'cup' && isDryRice(ing.name)) {
    const c = roundRiceCups(q);
    qtyText = `${fmtFrac(c)} ${unitLabel('cup', c)}`;
  } else if (ing.unit === 'oz') {
    qtyText = `${q >= 4 ? Math.round(q) : fmtFrac(q)} oz`;
  } else {
    qtyText = `${fmtFrac(q)}${ing.unit ? ' ' + unitLabel(ing.unit, q) : ''}`;
  }
  return `<li class="${cls}" onclick="this.classList.toggle('got')">
    <span class="ing-text"><span class="ing-qty">${escHtml(qtyText)}</span> <span class="ing-name">${name}</span></span>${cartBtnHtml(k)}
  </li>`;
}

function recipeBodyHtml(r) {
  cartRecipe = r;
  const base   = r.baseServings || BASE_SERVINGS;
  const factor = servings / base;
  const ings   = r.ingredients || [];
  const steps  = r.instructions || [];

  let html = `<div class="rv-card">
    <div class="rv-card-head"><span>Servings</span></div>
    <div class="rv-card-body">
      <div class="serv-row">
        ${SERVING_OPTIONS.map(n => `<button class="serv-btn${n === servings ? ' active' : ''}" onclick="setServings(${n})">${n}</button>`).join('')}
      </div>
    </div>
  </div>`;

  html += `<div class="rv-card collapsible${ingredientsOpen ? ' open' : ''}" id="ing-card">
    <div class="rv-card-head" onclick="toggleIngredients()">
      <span>Ingredients${ings.length ? ` <span class="cat-count">${ings.length}</span>` : ''}</span>
      <span class="menu-cat-chevron">▼</span>
    </div>
    <div class="rv-card-body">
      ${ings.length ? `<ul class="ing-list">${ings.map((i, k) => ingredientHtml(i, factor, k)).join('')}</ul>` : '<div class="empty-msg">No ingredients listed.</div>'}
    </div>
  </div>`;

  html += `<div class="rv-card">
    <div class="rv-card-head"><span>Instructions</span></div>
    <div class="rv-card-body">
      ${steps.length ? `<ol class="step-list">${steps.map(s => `<li>${scaleStepHtml(s, factor)}</li>`).join('')}</ol>` : '<div class="empty-msg">No instructions yet.</div>'}
    </div>
  </div>`;

  if (r.notes && r.notes.trim()) {
    html += `<div class="rv-card">
      <div class="rv-card-head"><span>Notes</span></div>
      <div class="rv-card-body"><div class="rv-notes">${escHtml(r.notes)}</div></div>
    </div>`;
  }
  return html;
}

let ingredientsOpen = (() => { try { return localStorage.getItem('dinners.ingOpen') !== '0'; } catch (e) { return true; } })();
function toggleIngredients() {
  ingredientsOpen = !ingredientsOpen;
  try { localStorage.setItem('dinners.ingOpen', ingredientsOpen ? '1' : '0'); } catch (e) {}
  document.getElementById('ing-card')?.classList.toggle('open', ingredientsOpen);
}
window.toggleIngredients = toggleIngredients;

function setServings(n) {
  servings = n;
  try { localStorage.setItem('dinners.servings', String(n)); } catch (e) {}
  if (currentView.v === 'recipe') {
    const y = window.scrollY;
    renderRecipeView(currentView.id);
    window.scrollTo(0, y);
  }
}
window.setServings = setServings;

// ─────────────────────────────────────────────────────────────────────────────
// ADD / EDIT MEAL + RECIPE
// ─────────────────────────────────────────────────────────────────────────────
let editorId = null;

async function renderEditor(id) {
  editorId = id;
  editorDirty = false;
  const container = document.getElementById('editor-view');
  const meal = id ? index.meals[id] : null;
  let recipe = null;

  if (id && meal?.hasRecipe) {
    recipe = recipeCache[id];
    if (!recipe) {
      container.innerHTML = '<div class="loading-msg">Loading recipe…</div>';
      try { recipe = await fetchRecipe(id); } catch (e) { recipe = null; }
      if (currentView.v !== 'editor' || editorId !== id) return;
    }
  }

  const name  = meal?.name || '';
  const cat   = normCat(meal?.category || 'Uncategorized');
  const ings  = recipe?.ingredients?.length ? recipe.ingredients : [{ qty: null, unit: '', name: '' }];
  const steps = (recipe?.instructions || []).join('\n');
  const notes = recipe?.notes || '';
  const base  = recipe?.baseServings || BASE_SERVINGS;

  container.innerHTML = `
    <div class="rv-top">
      <button class="back-btn" onclick="goBack()">Cancel</button>
      <div class="spacer"></div>
      <button class="btn-primary" onclick="saveEditor()" id="ed-save-btn">Save</button>
    </div>
    <div class="rv-title">${id ? 'Edit meal' : 'New meal'}</div>

    <label class="ed-label" for="ed-name">Meal name</label>

    <div class="ed-row2">
      <div>
        <label class="ed-label" for="ed-cat">Category</label>
        <select class="ed-select" id="ed-cat">
          ${MEAL_CATEGORIES.map(c => `<option value="${escAttr(c)}"${c === cat ? ' selected' : ''}>${escHtml(c)}</option>`).join('')}
        </select>
      </div>
      <div style="max-width:110px;">
        <label class="ed-label" for="ed-serves">Serves</label>
        <input class="ed-input" id="ed-serves" type="number" inputmode="numeric" min="1" max="20" value="${base}">
      </div>
    </div>

    <label class="ed-label">Ingredients</label>
    <div id="ed-ings"></div>
    <div class="ed-btn-row">
      <button class="toolbar-btn" onclick="addIngRow()">+ Add ingredient</button>
      <button class="toolbar-btn" onclick="togglePasteBox()">Paste a list</button>
    </div>
    <div class="paste-box" id="paste-box">
      <textarea class="ed-textarea" id="paste-text" placeholder="One ingredient per line, e.g.&#10;1 1/2 lb ground beef&#10;2 cups rice&#10;1 onion, diced&#10;salt to taste"></textarea>
      <div class="ed-hint">Amounts and units (lb, oz, cup, tbsp, tsp, can, clove, pinch) are picked out automatically. Check them after.</div>
      <div class="ed-btn-row"><button class="btn-primary" onclick="applyPaste()">Add these</button></div>
    </div>
    <div class="ed-hint">Qty accepts 1.5, 1 1/2 or 1½. Leave it blank for "to taste" items so they don't scale. Use lb for meat and fish to get pack suggestions.</div>

    <label class="ed-label" for="ed-steps">Instructions</label>
    <textarea class="ed-textarea" id="ed-steps" style="min-height:180px;" placeholder="One step per line">${escHtml(steps)}</textarea>
    <div class="ed-hint">One step per line. Pasted step numbers are removed automatically.</div>

    <label class="ed-label" for="ed-notes">Cooking notes</label>
    <textarea class="ed-textarea" id="ed-notes" placeholder="Tips, swaps, what to buy…">${escHtml(notes)}</textarea>

    ${id ? `<div class="ed-danger-zone"><button class="btn-danger" onclick="askDeleteMeal()">Delete meal</button></div>` : ''}
  `;
  renderIngRows(ings);
  container.oninput = () => { editorDirty = true; };
  if (!id) setTimeout(() => document.getElementById('ed-name')?.focus(), 50);
}

function unitOptions(selected) {
  const list = UNITS.includes(selected) ? UNITS : [...UNITS, selected];
  return list.map(u => `<option value="${escAttr(u)}"${u === selected ? ' selected' : ''}>${u || '—'}</option>`).join('');
}

function renderIngRows(rows) {
  const box = document.getElementById('ed-ings');
  if (!box) return;
  box.innerHTML = rows.map((r, i) => `<div class="ing-edit-row" data-i="${i}">
    <input class="ed-input ed-qty" value="${escAttr(fmtQtyInput(r.qty, r.unit))}" placeholder="Qty" inputmode="text" autocomplete="off">
    <select class="ed-select ed-unit">${unitOptions(r.unit || '')}</select>
    <input class="ed-input ed-ingname" value="${escAttr(r.name)}" placeholder="Ingredient" autocomplete="off">
    <button class="menu-delete-btn" onclick="removeIngRow(${i})" title="Remove">×</button>
  </div>`).join('');
}

function collectIngRows() {
  return [...document.querySelectorAll('#ed-ings .ing-edit-row')].map(row => ({
    qty:  parseQty(row.querySelector('.ed-qty').value),
    unit: row.querySelector('.ed-unit').value,
    name: row.querySelector('.ed-ingname').value.trim(),
  }));
}

function addIngRow() {
  const rows = collectIngRows();
  rows.push({ qty: null, unit: '', name: '' });
  renderIngRows(rows);
  editorDirty = true;
  const all = document.querySelectorAll('#ed-ings .ed-qty');
  all[all.length - 1]?.focus();
}
window.addIngRow = addIngRow;

function removeIngRow(i) {
  const rows = collectIngRows();
  rows.splice(i, 1);
  renderIngRows(rows.length ? rows : [{ qty: null, unit: '', name: '' }]);
  editorDirty = true;
}
window.removeIngRow = removeIngRow;

function togglePasteBox() {
  const box = document.getElementById('paste-box');
  if (box.classList.toggle('open')) document.getElementById('paste-text').focus();
}
window.togglePasteBox = togglePasteBox;

function applyPaste() {
  const text = document.getElementById('paste-text').value;
  const parsed = text.split(/\n/).map(parseIngredientLine).filter(Boolean);
  if (!parsed.length) return;
  const rows = collectIngRows().filter(r => r.name || r.qty != null);
  renderIngRows([...rows, ...parsed]);
  document.getElementById('paste-text').value = '';
  document.getElementById('paste-box').classList.remove('open');
  editorDirty = true;
  toast(`Added ${parsed.length} ingredient${parsed.length === 1 ? '' : 's'}`);
}
window.applyPaste = applyPaste;

async function saveEditor() {
  const name = document.getElementById('ed-name').value.trim();
  if (!name) { toast('Give the meal a name'); document.getElementById('ed-name').focus(); return; }
  const dup = Object.entries(index.meals).find(([k, m]) => k !== editorId && m.name.trim().toLowerCase() === name.toLowerCase());
  if (dup) { toast('A meal with that name already exists'); return; }

  const category     = normCat(document.getElementById('ed-cat').value);
  const baseServings = Math.max(1, Math.min(20, parseInt(document.getElementById('ed-serves').value, 10) || BASE_SERVINGS));
  const ingredients  = collectIngRows().filter(r => r.name);
  const instructions = parseSteps(document.getElementById('ed-steps').value);
  const notes        = document.getElementById('ed-notes').value.trim();
  const hasRecipe    = ingredients.length > 0 || instructions.length > 0 || !!notes;

  let id = editorId;
  const isNew = !id;
  if (isNew) {
    id = slugify(name);
    while (index.meals[id] || index.deletedAt[id]) id = slugify(name) + '-' + shortId();
  }

  const btn = document.getElementById('ed-save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  const now = Date.now();
  try {
    if (hasRecipe) {
      const recipe = { name, category, baseServings, ingredients, instructions, notes, updatedAt: now };
      await setDoc(recipeRef(id), recipe);
      recipeCache[id] = recipe;
    }
    index.meals[id] = { name, category, hasRecipe, updatedAt: now };
    delete index.deletedAt[id];
    await saveIndex();
  } catch (e) {
    console.error('Save error:', e);
    btn.disabled = false; btn.textContent = 'Save';
    toast('Couldn\'t save. Check your connection and try again.');
    return;
  }

  editorDirty = false;
  toast('Saved');
  if (isNew) {
    // Replace the editor with the new recipe's view
    const next = { v: 'recipe', id, d: currentView.d };
    history.replaceState(next, '');
    applyView(next);
  } else {
    history.back();   // back to the recipe view, which redraws from the updated cache
  }
}
window.saveEditor = saveEditor;

function askDeleteMeal() {
  const meal = index.meals[editorId];
  document.getElementById('modal-delete-meal-body').textContent =
    `"${meal?.name || 'This meal'}" and its recipe will be removed for everyone. This can't be undone.`;
  openModal('modal-delete-meal');
}
window.askDeleteMeal = askDeleteMeal;

async function confirmDeleteMeal() {
  closeModal('modal-delete-meal');
  const id = editorId;
  if (!id) return;
  try {
    delete index.meals[id];
    index.deletedAt[id] = Date.now();
    await saveIndex();
    await deleteDoc(recipeRef(id)).catch(() => {});
    delete recipeCache[id];
    // Same as grocery app: deleting a meal also removes it from This Week
    const before = (planner.thisWeek || []).length;
    planner.thisWeek = (planner.thisWeek || []).filter(d => d.mealId !== id);
    if (planner.thisWeek.length !== before) { planner.thisWeekAt = Date.now(); savePlanner(); }
  } catch (e) {
    toast('Couldn\'t delete. Try again.');
    return;
  }
  editorDirty = false;
  toast('Meal deleted');
  history.go(-(currentView.d || 1));   // all the way back to the list
}
window.confirmDeleteMeal = confirmDeleteMeal;

  [/olive oil/, 'oil:Olive'],
  [/canola|neutral oil|vegetable oil/, 'oil:Canola'],
  [/mac (and|&) cheese/, 'mac_cheese'],
  [/\bflour\b/, 'flour'],
];

// When nothing matches: which section's Other field it goes in
const OTHER_SECTION_RULES = [
  [/chard|kale|spinach|marjoram/, 'vegetables'],
  [/beef|pork|chicken|turkey|lamb|veal|shrimp|cod|salmon|fish|sausage|chuck|shoulder|scallop|crab|brat/, 'meat'],
  [/cream|milk|cheese|ricotta|feta|halloumi|swiss|kimchi|tofu/, 'refrigerated'],
  [/\bbuns?\b|bread|rolls?\b|lavash|naan|flatbread/, 'bakery'],
  [/orange|berr|grape|mango|pineapple|peach|melon/, 'fruit'],
  [/cilantro|parsley|basil|dill|marjoram|mint|thyme|rosemary|sprig|jalape|mushroom|tatsoi|chard|escarole|kale|spinach|cabbage|radish|tomatillo|lettuce|asparagus|green bean|squash|serrano|poblano|leek|fennel|eggplant|arugula|herb|potato|chiles?\b|corn\b/, 'vegetables'],
];

// Words dropped from text typed into an Other field ("garlic cloves, minced" → "Garlic cloves")
const SHOP_TEXT_DROP = /\b(boneless|skinless|thin|thinly|finely|roughly|coarsely|freshly|fresh|chopped|minced|diced|sliced|grated|shredded|torn|halved|crushed|peeled|cubed|julienned|drained|rinsed|packed|lightly|large|medium|small|about|approximately|optional|plus|divided|softened|beaten|thawed|uncooked|cooked|dry|head|bunch(es)?|slices?|tsp|tbsp|cups?|oz|lbs?|sprigs?\s+of|juice of|zest of|for serving)\b/gi;

function shoppingText(name) {
  const segs = String(name || '').replace(/\([^)]*\)/g, ' ').split(/,|:/).map(s => s.trim()).filter(Boolean);
  for (const seg of segs) {
    const c = seg.replace(/\bplus\b.*$/i, '').replace(SHOP_TEXT_DROP, ' ').replace(/\b\d+(\.\d+)?\b|[½¼¾⅓⅔⅛]/g, ' ').replace(/\s+/g, ' ').trim().replace(/^[^a-z]+/i, '').replace(/^(and|or|of)\s+/i, '').trim();
    if (/[a-z]{3}/i.test(c)) return c.charAt(0).toUpperCase() + c.slice(1);
  }
  return String(name || '').trim();
}

// ─── Grocery catalog + list (read on demand) ────────────────────────────────
let baseCatalogPromise = null;
function getBaseCatalog() {
  if (!baseCatalogPromise) {
    baseCatalogPromise = (async () => {
      try {
        const res = await fetch('index.html', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();
        const start = html.indexOf('const CATALOG = [');
        if (start < 0) throw new Error('CATALOG not found');
        const from = html.indexOf('[', start);
        const to = html.indexOf('\n];', from);
        const cat = parseLoose(html.slice(from, to + 2));
        if (!Array.isArray(cat) || !cat.length || !cat[0].items) throw new Error('bad CATALOG');
        return cat;
      } catch (e) {
        console.warn('Using built-in grocery catalog:', e.message);
        return GROCERY_CATALOG_FALLBACK;
      }
    })();
  }
  return baseCatalogPromise;
}

// Same rules the grocery app uses for its runtime catalog additions/deletions
function applyGroceryCatalogChanges(base, gState) {
  const cat = JSON.parse(JSON.stringify(base));
  (gState.catalogDeletions || []).forEach(({ itemId, variant }) => {
    cat.forEach(c => {
      if (variant) {
        const it = c.items.find(i => i.id === itemId);
        if (it && it.variants) {
          it.variants = it.variants.filter(v => v !== variant);
          if (it.variants.filter(v => v !== 'Other').length === 0) c.items = c.items.filter(i => i.id !== itemId);
        }
      } else c.items = c.items.filter(i => i.id !== itemId);
    });
  });
  (gState.catalogAdditions || []).forEach(a => {
    const c = cat.find(x => x.id === a.catId);
    if (!c) return;
    if (a.type === 'variant') {
      const p = c.items.find(i => i.id === a.variantParentId);
      if (p && p.variants && !p.variants.includes(a.variantText)) p.variants.splice(Math.max(0, p.variants.indexOf('Other')), 0, a.variantText);
    } else if (a.item && !c.items.some(i => i.id === a.item.id)) {
      c.items.push(a.item);
    }
  });
  return cat;
}

let groceryState = null;
async function loadGroceryState() {
  const snap = await getDoc(GROCERY_REF);
  groceryState = snap.exists() ? snap.data() : {};
  return groceryState;
}
async function getGroceryContext() {
  const [base, gState] = await Promise.all([getBaseCatalog(), loadGroceryState()]);
  return { catalog: applyGroceryCatalogChanges(base, gState), gState };
}

function findCatalogItem(catalog, itemId) {
  for (const c of catalog) {
    const it = c.items.find(i => i.id === itemId);
    if (it) return { cat: c, item: it };
  }
  return null;
}

function otherSectionFor(text, catalog) {
  const t = String(text).toLowerCase();
  let id = 'pantry';
  for (const [re, sec] of OTHER_SECTION_RULES) { if (re.test(t)) { id = sec; break; } }
  if (!catalog.some(c => c.id === id)) id = (catalog.find(c => c.id === 'pantry') || catalog[0]).id;
  return id;
}

// → { kind:'item', catId, itemId, variant, label }  or  { kind:'other', catId, text }
function matchIngredient(name, catalog) {
  const text = String(name || '').toLowerCase().replace(/\([^)]*\)/g, ' ');
  const asOther = catId => ({ kind: 'other', catId: catalog.some(c => c.id === catId) ? catId : otherSectionFor(text, catalog), text: shoppingText(name) });

  // Try the main part first ("neutral oil, for tofu" → "neutral oil"), then the whole text
  const head = text.split(/[,:;]/)[0];
  const findRule = s => {
    if (/bell pepper/.test(s)) {
      const color = (s.match(/\b(red|green|yellow|orange)\b/) || [])[1];
      return color ? 'bell_peppers:' + color.charAt(0).toUpperCase() + color.slice(1) : 'other:vegetables';
    }
    for (const [re, t] of GROCERY_RULES) { if (re.test(s)) return t; }
    return null;
  };
  const target = findRule(head) || findRule(text);
  if (!target) return asOther(otherSectionFor(text, catalog));
  if (target.startsWith('other:')) return asOther(target.slice(6));

  const [itemId, variant] = target.split(/:(.+)/);
  const found = findCatalogItem(catalog, itemId);
  if (!found) return asOther(otherSectionFor(text, catalog));               // item was removed from the grocery catalog
  if (variant && !(found.item.variants || []).includes(variant)) return asOther(found.cat.id);
  if (!variant && found.item.type === 'multiAdd') return asOther(found.cat.id);
  return { kind: 'item', catId: found.cat.id, itemId, variant: variant || null,
           label: `${found.cat.label} › ${found.item.name}${variant ? ' › ' + variant : ''}` };
}

function groceryKey(t) { return t.variant ? `${t.itemId}:${t.variant}` : t.itemId; }

function otherTextOnList(gState, text) {
  const n = normName(text);
  const ff = gState.freeform || {};
  if (Object.values(ff).some(list => (list || []).some(e => normName(e.text) === n))) return true;
  const notes = gState.notes || {};
  return Object.keys(gState.items || {}).some(k => k.includes(':Other:') && (gState.items[k]?.qty || 0) > 0 && normName(notes['__label_' + k]) === n);
}

function isOnGroceryList(target, gState) {
  if (target.kind === 'item') return ((gState.items || {})[groceryKey(target)]?.qty || 0) > 0;
  return otherTextOnList(gState, target.text);
}

// ─── Recipe screen: cart icons ──────────────────────────────────────────────
let cartRecipe = null;   // the recipe currently shown, for the 🛒 buttons

async function refreshCartIcons() {
  const r = cartRecipe;
  if (!r) return;
  try {
    const { catalog, gState } = await getGroceryContext();
    if (r !== cartRecipe) return;
    (r.ingredients || []).forEach((ing, k) => {
      const btn = document.getElementById('cart-' + k);
      if (!btn) return;
      const on = isOnGroceryList(matchIngredient(ing.name, catalog), gState);
      btn.classList.toggle('on', on);
      btn.textContent = on ? '✓' : '🛒';
      btn.title = on ? 'Already on the grocery list' : 'Add to grocery list';
    });
  } catch (e) { console.warn('Grocery list check failed:', e); }
}

// ─── Pop-up ─────────────────────────────────────────────────────────────────
let groceryCtx = null;     // { catalog, gState }
let groceryIng = null;     // the ingredient being added

async function openGroceryAdd(k) {
  const ing = cartRecipe?.ingredients?.[k];
  if (!ing) return;
  const box = document.getElementById('modal-grocery-box');
  box.innerHTML = '<div class="loading-msg">Checking the grocery list…</div>';
  openModal('modal-grocery');
  try { groceryCtx = await getGroceryContext(); }
  catch (e) {
    box.innerHTML = `<div class="modal-title">Couldn't reach the grocery list</div>
      <div class="modal-body">Check your connection and try again.</div>
      <div class="modal-actions"><button class="modal-cancel" onclick="closeModal('modal-grocery')">Close</button></div>`;
    return;
  }
  groceryIng = ing;
  const { catalog, gState } = groceryCtx;
  const match = matchIngredient(ing.name, catalog);

  if (isOnGroceryList(match, gState)) {
    box.innerHTML = `<div class="modal-title">Already on the list</div>

      <div class="modal-actions"><button class="modal-confirm" onclick="closeModal('modal-grocery')">OK</button></div>`;
    return;
  }

  const selected = match.kind === 'item' ? groceryKey(match) : 'other:' + match.catId;
  const options = catalog.map(c => {
    const opts = [];
    c.items.forEach(it => {
      if (it.type === 'simple') opts.push([it.id, it.name]);
      else if (it.type === 'multiAdd') (it.variants || []).filter(v => v !== 'Other').forEach(v => opts.push([`${it.id}:${v}`, `${it.name} › ${v}`]));
    });
    opts.push(['other:' + c.id, 'Other (type a name)']);
    return `<optgroup label="${escAttr(c.label)}">${opts.map(([v, l]) =>
      `<option value="${escAttr(v)}"${v === selected ? ' selected' : ''}>${escHtml(l)}</option>`).join('')}</optgroup>`;
  }).join('');

  box.innerHTML = `<div class="modal-title">Add to grocery list</div>
    <div class="ed-hint" style="margin:-2px 0 10px;">From recipe: ${escHtml(ing.name)}</div>
    ${gState.locked ? '<div class="grocery-warn">🔒 The grocery list is locked for shopping. You can still add this, but whoever is shopping may not see it.</div>' : ''}
    <label class="ed-label" for="grocery-target" style="margin-top:4px;">Goes to</label>
    <select class="ed-select" id="grocery-target" onchange="onGroceryTargetChange()">${options}</select>
    <div id="grocery-other-wrap">
      <label class="ed-label" for="grocery-other-text">Name on the list</label>
      <input class="ed-input" id="grocery-other-text" value="${escAttr(match.kind === 'other' ? match.text : shoppingText(ing.name))}" oninput="onGroceryTargetChange()" autocomplete="off">
    </div>
    <div id="grocery-already" class="grocery-already hidden">Already on the list</div>
    <div class="modal-actions" style="margin-top:16px;">
      <button class="modal-cancel" onclick="closeModal('modal-grocery')">Cancel</button>
      <button class="modal-confirm" id="grocery-add-btn" onclick="confirmGroceryAdd()">Add</button>
    </div>`;
  onGroceryTargetChange();
}
window.openGroceryAdd = openGroceryAdd;

function readGroceryTarget() {
  const v = document.getElementById('grocery-target').value;
  if (v.startsWith('other:')) return { kind: 'other', catId: v.slice(6), text: document.getElementById('grocery-other-text').value.trim() };
  const [itemId, variant] = v.split(/:(.+)/);
  return { kind: 'item', itemId, variant: variant || null };
}

function onGroceryTargetChange() {
  const t = readGroceryTarget();
  document.getElementById('grocery-other-wrap').classList.toggle('hidden', t.kind !== 'other');
  const already = t.kind === 'other' ? (!!t.text && otherTextOnList(groceryCtx.gState, t.text)) : isOnGroceryList(t, groceryCtx.gState);
  document.getElementById('grocery-already').classList.toggle('hidden', !already);
  document.getElementById('grocery-add-btn').disabled = already || (t.kind === 'other' && !t.text);
}
window.onGroceryTargetChange = onGroceryTargetChange;

async function confirmGroceryAdd() {
  const t = readGroceryTarget();
  if (t.kind === 'other' && !t.text) return;
  const btn = document.getElementById('grocery-add-btn');
  btn.disabled = true; btn.textContent = 'Adding…';
  let result;
  try { result = await addToGroceryList(t); }
  catch (e) {
    console.error('Grocery add error:', e);
    btn.disabled = false; btn.textContent = 'Add';
    toast('Couldn\'t add it. Check your connection and try again.');
    return;
  }
  closeModal('modal-grocery');
  toast(result === 'already' ? 'Already on the list' : 'Added to the grocery list');
  refreshCartIcons();
}
window.confirmGroceryAdd = confirmGroceryAdd;

// Adds one item inside a transaction, so nothing else on the grocery list is touched
async function addToGroceryList(t) {
  let result = 'added';
  await runTransaction(db, async tx => {
    result = 'added';
    const snap = await tx.get(GROCERY_REF);
    if (!snap.exists()) throw new Error('Grocery list not found');
    const data = snap.data();
    const now = Date.now();
    if (t.kind === 'item') {
      const key = groceryKey(t);
      const items = { ...(data.items || {}) };
      if ((items[key]?.qty || 0) > 0) { result = 'already'; return; }
      items[key] = { qty: 1, updatedAt: now };
      const deletedAt = { ...(data.deletedAt || {}) };
      delete deletedAt[key];                       // same as the grocery app does when re-adding
      tx.set(GROCERY_REF, { ...data, items, deletedAt });
    } else {
      if (otherTextOnList(data, t.text)) { result = 'already'; return; }
      const freeform = { ...(data.freeform || {}) };
      freeform[t.catId] = [...(freeform[t.catId] || []), { id: uuid(), text: t.text, qty: 1, updatedAt: now }];
      tx.set(GROCERY_REF, { ...data, freeform, freeformAt: now });
    }
  });
  return result;
}

// IMPORT RECIPES  (paste the formatted text from Claude or ChatGPT)
