const AI_PROMPT = `Convert the recipe(s) in the attached photo(s) or text into JSON for my recipe app.
Reply with ONLY one JSON code block, nothing else.

Format (an array, even for a single recipe):
[
  {
    "name": "Fish Tacos",
    "category": "Fish",
    "servings": 4,
    "ingredients": [
      { "qty": 1.5,  "unit": "lb",  "name": "cod fillets" },
      { "qty": 0.5,  "unit": "cup", "name": "sour cream" },
      { "qty": 2,    "unit": "",    "name": "limes, cut into wedges" },
      { "qty": null, "unit": "",    "name": "salt, to taste" }
    ],
    "instructions": ["First step.", "Second step."],
    "notes": ""
  }
]

Rules:
- Scale everything to serve 4, including amounts mentioned in the instructions.
- category must be one of: Fish, Meat, Pork, Poultry, Soups, Vegetarian, Uncategorized
- qty is a number with decimals (0.5, not 1/2), or null for "to taste" or optional items.
- unit is one of: lb, oz, cup, tbsp, tsp, can, clove, pinch, or "" for countable items.
- Meat, poultry, pork and fish are always in lb.
- instructions: one string per step, no step numbers. Write the actual amounts in each step using digits or fractions (e.g. "Add 1½ tbsp olive oil"), never words like "half".
- notes: cooking tips as one string, or "" if none.
- name: short and plain, no appliance names or extra descriptions in parentheses. If I give you a meal name, use exactly that name.`;

// Accepts strict JSON, or JavaScript-style objects (unquoted keys, single quotes,
// trailing commas, "const X = [...]"), with or without a ``` code fence around it.
function parseLoose(text) {
  let s = String(text || '').trim();
  s = s.replace(/```[a-zA-Z]*\s*/g, '').replace(/```/g, '').trim();
  const first = s.search(/[\[{]/);
  const last  = Math.max(s.lastIndexOf(']'), s.lastIndexOf('}'));
  if (first < 0 || last < first) throw new Error('No recipe data found. Paste the whole block the AI gave you.');
  s = s.slice(first, last + 1);
  try { return JSON.parse(s); } catch (e) { /* fall through to the lenient pass */ }

  // Lenient pass: walk the text, converting JS-style syntax to JSON outside of strings
  let out = '', i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (ch === '"' || ch === "'") {
      const q = ch; let str = ''; i++;
      while (i < s.length && s[i] !== q) {
        if (s[i] === '\\' && i + 1 < s.length) { str += s[i] + s[i + 1]; i += 2; continue; }
        if (s[i] === '\n') { str += '\\n'; i++; continue; }
        str += (q === "'" && s[i] === '"') ? '\\"' : s[i];
        i++;
      }
      if (q === "'") str = str.replace(/\\'/g, "'");
      out += '"' + str + '"'; i++;
      continue;
    }
    if (ch === '/' && s[i + 1] === '/') { while (i < s.length && s[i] !== '\n') i++; continue; }
    if (/[A-Za-z_$]/.test(ch)) {
      let j = i; while (j < s.length && /[\w$]/.test(s[j])) j++;
      const word = s.slice(i, j);
      let k = j; while (k < s.length && /\s/.test(s[k])) k++;
      if (s[k] === ':' && !['true','false','null'].includes(word)) out += '"' + word + '"';
      else out += word;
      i = j; continue;
    }
    out += ch; i++;
  }
  out = out.replace(/,\s*([\]}])/g, '$1');
  try { return JSON.parse(out); }
  catch (e) { throw new Error('Couldn\'t read that text. Make sure you copied the whole code block, from the first [ to the last ].'); }
}

function normUnit(u) {
  const k = String(u || '').trim().toLowerCase().replace(/\.$/, '');
  if (!k) return '';
  return UNIT_ALIASES[k] || null;   // null = not a unit the app knows
}

// Turn whatever the AI produced into the app's recipe shape, collecting warnings
function normalizeRecipe(raw) {
  const warnings = [];
  const r = raw && typeof raw === 'object' ? raw : {};
  const name = String(r.name || r.title || '').trim();
  let category = String(r.category || '').trim();
  const catMatch = MEAL_CATEGORIES.find(c => c.toLowerCase() === category.toLowerCase());
  if (!catMatch) { if (category) warnings.push(`Category "${category}" isn't one of yours, so it goes in Uncategorized.`); category = 'Uncategorized'; }
  else category = catMatch;

  let baseServings = parseInt(r.servings ?? r.baseServings ?? r.serves, 10);
  if (!(baseServings > 0 && baseServings <= 20)) baseServings = BASE_SERVINGS;
  if (baseServings !== BASE_SERVINGS) warnings.push(`Written for ${baseServings} servings (the app will still scale it).`);

  const ingredients = [];
  (Array.isArray(r.ingredients) ? r.ingredients : []).forEach(i => {
    if (typeof i === 'string') { const p = parseIngredientLine(i); if (p) ingredients.push(p); return; }
    if (!i || typeof i !== 'object') return;
    let ingName = String(i.name ?? i.item ?? i.ingredient ?? '').trim();
    if (!ingName) return;
    let qty = i.qty ?? i.quantity ?? i.amount ?? null;
    qty = (qty === null || qty === '') ? null : (typeof qty === 'number' ? qty : parseQty(qty));
    let unit = normUnit(i.unit);
    if (unit === null) { ingName = `${String(i.unit).trim()} ${ingName}`; unit = ''; }   // e.g. "bunch" stays readable
    ingredients.push({ qty, unit, name: ingName });
  });
  if (!ingredients.length) warnings.push('No ingredients found.');

  let instructions = r.instructions ?? r.steps ?? r.directions ?? [];
  instructions = Array.isArray(instructions)
    ? instructions.map(s => String(typeof s === 'object' && s ? (s.text ?? s.step ?? '') : s).trim().replace(/^(?:step\s*)?\d+\s*[.):-]\s*/i, '')).filter(Boolean)
    : parseSteps(instructions);
  if (!instructions.length) warnings.push('No instructions found.');

  let notes = r.notes ?? r.tips ?? '';
  if (Array.isArray(notes)) notes = notes.join(' ');
  notes = String(notes || '').trim();

  return { name, category, baseServings, ingredients, instructions, notes, warnings };
}

function findMealIdByName(name) {
  const n = normName(name);

}

function previewImport() {
  const box = document.getElementById('import-preview');
  const text = document.getElementById('import-text').value;
  if (!text.trim()) { toast('Paste the recipe text first'); return; }
  let data;
  try { data = parseLoose(text); }
  catch (e) { box.innerHTML = `<div class="error-box" style="margin-top:12px;">${escHtml(e.message)}</div>`; importPlan = []; return; }
  if (data && !Array.isArray(data) && Array.isArray(data.recipes)) data = data.recipes;
  const list = (Array.isArray(data) ? data : [data]).map(normalizeRecipe);

  if (importTargetId && list.length > 1) {
    box.innerHTML = `<div class="error-box" style="margin-top:12px;">This text has ${list.length} recipes, but you're adding a recipe to one meal. Paste just one, or use <b>Import</b> on the Meals tab for several.</div>`;
    importPlan = []; return;
  }

  const seen = new Set();
  importPlan = list.map(rec => {
    let targetId = importTargetId || (rec.name ? findMealIdByName(rec.name) : null);
    const key = targetId || normName(rec.name);
    const dup = seen.has(key); seen.add(key);
    const meal = targetId ? index.meals[targetId] : null;
    if (!rec.name && !meal) rec.warnings.unshift('No meal name, so this one will be skipped.');
    if (dup) rec.warnings.unshift('Appears twice in what you pasted. Only the first is saved.');
    return { recipe: rec, targetId, replaces: !!(meal && meal.hasRecipe), skip: dup || (!rec.name && !meal) };
  });

  const toSave = importPlan.filter(p => !p.skip);
  const replacing = toSave.filter(p => p.replaces).length;
  box.innerHTML = `<div class="ed-label" style="margin-top:18px;">Preview: ${toSave.length} recipe${toSave.length === 1 ? '' : 's'} to save</div>
    ${importPlan.map(p => previewCardHtml(p)).join('')}
    ${toSave.length ? `<div class="ed-btn-row" style="margin-top:12px;">
      <button class="btn-primary" id="import-save-btn" onclick="saveImport()">Save ${toSave.length} recipe${toSave.length === 1 ? '' : 's'}${replacing ? ` (replaces ${replacing})` : ''}</button>
    </div>` : ''}`;
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
window.previewImport = previewImport;

function previewCardHtml(p) {
  const r = p.recipe;
  const meal = p.targetId ? index.meals[p.targetId] : null;
  const shownName = meal ? meal.name : r.name;
  const shownCat  = meal ? normCat(meal.category) : r.category;
  const status = p.skip ? '<span class="imp-tag skip">Skipped</span>'
    : p.replaces ? '<span class="imp-tag replace">Replaces existing recipe</span>'
    : meal ? '<span class="imp-tag match">Adds recipe to existing meal</span>'
    : '<span class="imp-tag new">New meal</span>';
  return `<div class="rv-card" style="margin-top:8px;">
    <div class="rv-card-body">
      <div style="font-weight:700;font-size:15px;margin-bottom:4px;">${escHtml(shownName || '(no name)')}</div>
      <div class="rv-meta" style="margin-bottom:8px;"><span class="rv-cat">${escHtml(shownCat)}</span>${status}</div>
      ${meal && r.name && normName(r.name) !== normName(meal.name) ? `<div class="ed-hint">The AI called it "${escHtml(r.name)}". Your meal name is kept.</div>` : ''}
      ${r.warnings.map(w => `<div class="imp-warn">⚠ ${escHtml(w)}</div>`).join('')}
      <div class="ed-hint" style="margin-top:6px;">${r.ingredients.length} ingredients · ${r.instructions.length} steps${r.notes ? ' · notes' : ''}</div>
      <ul class="imp-ings">${r.ingredients.map(i => ingredientHtml(i, 1)).join('')}</ul>
      <ol class="imp-steps">${r.instructions.map(s => `<li>${escHtml(s)}</li>`).join('')}</ol>
    </div>
  </div>`;
}

async function saveImport() {
  const toSave = importPlan.filter(p => !p.skip);
  if (!toSave.length) return;
  const replacing = toSave.filter(p => p.replaces);
  if (replacing.length && !confirm(`This replaces the existing recipe for: ${replacing.map(p => index.meals[p.targetId].name).join(', ')}. Continue?`)) return;

  const btn = document.getElementById('import-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  const now = Date.now();
  const savedIds = [];
  try {
    for (const p of toSave) {
      const r = p.recipe;
      let id = p.targetId;
      const meal = id ? index.meals[id] : null;
      const name = meal ? meal.name : r.name;
      const category = meal ? normCat(meal.category) : r.category;
      if (!id) {
        id = slugify(name);
        while (index.meals[id] || index.deletedAt[id]) id = slugify(name) + '-' + shortId();
      }
      const recipe = { name, category, baseServings: r.baseServings, ingredients: r.ingredients, instructions: r.instructions, notes: r.notes, updatedAt: now };
      await setDoc(recipeRef(id), recipe);
      recipeCache[id] = recipe;
      index.meals[id] = { name, category, hasRecipe: true, updatedAt: now };
      delete index.deletedAt[id];
      savedIds.push(id);
    }
    await saveIndex();
  } catch (e) {
    console.error('Import error:', e);
    if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
    toast(savedIds.length ? `Saved ${savedIds.length}, then hit an error. Try again for the rest.` : 'Couldn\'t save. Check your connection and try again.');
    if (savedIds.length) saveIndex().catch(() => {});
    return;
  }
  editorDirty = false;
  toast(`Saved ${savedIds.length} recipe${savedIds.length === 1 ? '' : 's'}`);
  if (importTargetId && savedIds.length === 1) {
    history.back();   // came from that meal's screen: go back to it, now showing the recipe
  } else if (savedIds.length === 1) {
    const next = { v: 'recipe', id: savedIds[0], d: currentView.d };
    history.replaceState(next, '');
    applyView(next);
  } else {
    history.go(-(currentView.d || 1));
  }
}
window.saveImport = saveImport;

// ─────────────────────────────────────────────────────────────────────────────
// TAKEOUT TAB  (same behavior as the grocery app's Takeout tab)
// ─────────────────────────────────────────────────────────────────────────────
function renderTakeout() {
  const container = document.getElementById('takeout-view');
  if (!loaded && !loadError) { container.innerHTML = '<div class="loading-msg">Loading…</div>'; return; }
  container.innerHTML = `${errorBox()}
    <div class="menu-toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="takeout-search-input" placeholder="Search restaurants…" value="${escAttr(takeoutSearch)}"
          oninput="onTakeoutSearch(this.value)" autocomplete="off">
        <button class="search-clear${takeoutSearch ? ' visible' : ''}" id="takeout-search-clear" onclick="clearTakeoutSearch()">×</button>
      </div>
      <button class="toolbar-btn" onclick="toggleAllTakeout()" id="takeout-expand-btn">${openTakeoutCats.size ? 'Collapse' : 'Expand'}</button>
      <button class="toolbar-btn${takeoutEditMode ? ' active' : ''}" onclick="toggleTakeoutEdit()">${takeoutEditMode ? 'Done' : 'Edit'}</button>
    </div>
    <div id="takeout-categories"></div>`;
  renderTakeoutCategories();
}

function renderTakeoutCategories() {
  const container = document.getElementById('takeout-categories');
  if (!container) return;
  const term = takeoutSearch.toLowerCase().trim();
  const groups = {};
  TAKEOUT_CATEGORIES.forEach(c => { groups[c] = []; });
  Object.entries(planner.takeout || {}).forEach(([name, data]) => {
    const cat = TAKEOUT_CATEGORIES.includes(data.category) ? data.category : 'Uncategorized';
    groups[cat].push({ name, ...data });
  });
  TAKEOUT_CATEGORIES.forEach(c => groups[c].sort((a, b) => a.name.localeCompare(b.name)));

  let html = '';
  TAKEOUT_CATEGORIES.forEach(cat => {
    let items = groups[cat];
    if (term) items = items.filter(r => r.name.toLowerCase().includes(term));
    if (items.length === 0 && !takeoutEditMode && cat !== 'Uncategorized') return;
    if (items.length === 0 && term) return;
    const isOpen = openTakeoutCats.has(cat) || !!term;

    html += `<div class="menu-cat-card${isOpen ? ' open' : ''}" id="takeout-cat-${slugify(cat)}">
      <div class="menu-cat-header" onclick="toggleTakeoutCat('${jsArg(cat)}')">
        <span class="menu-cat-title">${escHtml(cat)}</span>
        <span class="cat-meta">${items.length ? `<span class="cat-count">${items.length}</span>` : ''}<span class="menu-cat-chevron">▼</span></span>
      </div>
      <div class="menu-cat-body">`;

    items.forEach(r => {
      const n = jsArg(r.name);
      html += `<div class="takeout-item-row">
        <div class="takeout-name">
          ${takeoutEditMode
            ? `<input value="${escAttr(r.name)}" onblur="renameTakeout('${n}', this.value)">
               <input class="takeout-url-input" value="${escAttr(r.url || '')}" placeholder="Order URL (optional)…"
                 onchange="updateTakeoutUrl('${n}', this.value)" inputmode="url" autocomplete="off">`
            : escHtml(r.name)}
        </div>
        ${!takeoutEditMode && r.url ? `<a class="takeout-order-btn" href="${escAttr(r.url)}" target="_blank" rel="noopener">Order ↗</a>` : ''}
        ${(takeoutEditMode || cat === 'Uncategorized') ? `
          <select class="menu-cat-select" onchange="moveTakeout('${n}', this.value)">
            ${TAKEOUT_CATEGORIES.map(c => `<option value="${escAttr(c)}"${c === cat ? ' selected' : ''}>${escHtml(c)}</option>`).join('')}
          </select>` : ''}
        ${takeoutEditMode ? `<button class="menu-delete-btn" onclick="deleteTakeout('${n}')">×</button>` : ''}
      </div>`;
    });

    if (!term && (cat === 'Uncategorized' || takeoutEditMode)) {
      html += `<div class="dinner-add-row" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border-light);">
        <input class="dinner-add-input" id="takeout-add-${slugify(cat)}" placeholder="Add restaurant…"
          onkeydown="if(event.key==='Enter')addTakeout('${jsArg(cat)}')" autocomplete="off">
        <button class="dinner-add-btn" onclick="addTakeout('${jsArg(cat)}')">Add</button>
      </div>`;
    }
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function onTakeoutSearch(val) {
  takeoutSearch = val;
  document.getElementById('takeout-search-clear')?.classList.toggle('visible', !!val.trim());
  renderTakeoutCategories();
}
window.onTakeoutSearch = onTakeoutSearch;

function clearTakeoutSearch() {
  takeoutSearch = '';
  const input = document.getElementById('takeout-search-input');
  if (input) input.value = '';
  document.getElementById('takeout-search-clear')?.classList.remove('visible');
  renderTakeoutCategories();
}
window.clearTakeoutSearch = clearTakeoutSearch;

function toggleAllTakeout() {
  openTakeoutCats = openTakeoutCats.size ? new Set() : new Set(TAKEOUT_CATEGORIES);
  renderTakeout();
}
window.toggleAllTakeout = toggleAllTakeout;

function toggleTakeoutCat(cat) {
  if (openTakeoutCats.has(cat)) openTakeoutCats.delete(cat); else openTakeoutCats.add(cat);
  document.getElementById('takeout-cat-' + slugify(cat))?.classList.toggle('open', openTakeoutCats.has(cat));
  const btn = document.getElementById('takeout-expand-btn');
  if (btn) btn.textContent = openTakeoutCats.size ? 'Collapse' : 'Expand';
}
window.toggleTakeoutCat = toggleTakeoutCat;

function toggleTakeoutEdit() { takeoutEditMode = !takeoutEditMode; renderTakeout(); }
window.toggleTakeoutEdit = toggleTakeoutEdit;

function addTakeout(cat) {
  const input = document.getElementById('takeout-add-' + slugify(cat));
  const name  = input?.value.trim();
  if (!name) return;
  if (planner.takeout[name]) { toast('That restaurant is already on the list'); return; }
  planner.takeout[name] = { category: cat, url: '' };
  planner.takeoutAt = Date.now();
  input.value = '';
  savePlanner();
  renderTakeoutCategories();
}
window.addTakeout = addTakeout;

function renameTakeout(oldName, newName) {
  newName = newName.trim();
  if (!newName || newName === oldName || planner.takeout[newName]) return;
  planner.takeout[newName] = planner.takeout[oldName];
  delete planner.takeout[oldName];
  planner.takeoutAt = Date.now();
  savePlanner();
  renderTakeoutCategories();
}
window.renameTakeout = renameTakeout;

function updateTakeoutUrl(name, url) {
  if (!planner.takeout[name]) return;
  planner.takeout[name].url = url.trim();
  planner.takeoutAt = Date.now();
  savePlanner();
}
window.updateTakeoutUrl = updateTakeoutUrl;

function moveTakeout(name, newCat) {
  if (!planner.takeout[name]) return;
  planner.takeout[name].category = newCat;
  planner.takeoutAt = Date.now();
  savePlanner();
  renderTakeoutCategories();
}
window.moveTakeout = moveTakeout;

function deleteTakeout(name) {
  delete planner.takeout[name];
  planner.takeoutAt = Date.now();
  savePlanner();
  renderTakeoutCategories();
}
window.deleteTakeout = deleteTakeout;

// ─────────────────────────────────────────────────────────────────────────────
// MODALS
// ─────────────────────────────────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id)?.classList.add('visible'); }
function closeModal(id) { document.getElementById(id)?.classList.remove('visible'); }
window.openModal  = openModal;
window.closeModal = closeModal;
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('visible'); });
});

// ─────────────────────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────────────────────
history.replaceState({ v: 'tab', d: 0 }, '');
renderAll();
loadFromCloud();
requestAnimationFrame(() => requestAnimationFrame(renderHeader));
window.addEventListener('resize', renderHeader);

// Exposed only for automated testing
window.__dinners = { matchIngredient, shoppingText, getBaseCatalog, applyGroceryCatalogChanges, isDryRice, parseLoose, normalizeRecipe, AI_PROMPT, parseQty, fmtFrac, scaleStepHtml, fmtLb, parseIngredientLine, mergeIndex, mergePlanner, fmtQtyInput, parseSteps };
</script>
